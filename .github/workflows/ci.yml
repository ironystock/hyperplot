name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFUMPT_VERSION: v0.12.0
  GOLANGCI_LINT_VERSION: v2.15.0
  # Pinned so a new release cannot fail every build with no code change;
  # keep in step with STATICCHECK_VERSION in the Makefile.
  STATICCHECK_VERSION: "2026.2.2"
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: LF line endings only
        run: |
          if git grep -lI $'\r' -- . ; then
            echo "::error::CRLF line endings found in the files above."
            exit 1
          fi

      - name: Zero dependencies
        run: |
          deps="$(go list -m all | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "::error::hyperplot must depend only on the standard library. Found:"
            echo "$deps"
            exit 1
          fi
          go mod tidy -diff

      - name: gofumpt
        run: |
          unformatted="$(go run mvdan.cc/gofumpt@${GOFUMPT_VERSION} -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofumpt-formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: ${{ env.STATICCHECK_VERSION }}
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Build it with this job's Go: a prebuilt binary made with an older
          # Go cannot read the standard library's export data from a newer one.
          install-mode: goinstall

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.24.x", stable]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: Build
        run: go build ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Run each benchmark once, so a benchmark that stops working fails
      # CI rather than the next 'make bench'.
      - name: Benchmarks run
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -run '^$' -bench . -benchtime 1x ./...

      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$total"
          echo "### Coverage (${{ matrix.os }}, Go ${{ matrix.go }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Golden files are up to date
        run: |
          if [ -n "$(git status --porcelain -- plot/testdata)" ]; then
            echo "::error::Tests changed files under plot/testdata/. Run 'make golden' and commit the result."
            git status --porcelain -- plot/testdata
            exit 1
          fi

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      # Runs every Fuzz* target in the module briefly. Long fuzzing runs
      # belong on a developer machine: make fuzz FUZZTIME=10m
      - name: Fuzz each target for 15s
        run: |
          set -e
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 15s
              echo "::endgroup::"
            done
          done

      # A failing input exists only on the runner; keep it so it can be
      # reproduced and committed as a regression seed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  client:
    name: Client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The client has no dependencies and no build step.
      - name: node --test
        working-directory: client
        run: node --test

      # The Node example server (node: built-ins only, no package.json).
      # Its tests read client/, spec/spec.md and spec/conformance/, so
      # they run on every change, not only changes under examples/node.
      - name: node --test (examples/node)
        working-directory: examples/node
        run: node --test

  python:
    name: Python example and checker (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest version examples/python/README.md supports
        # (the checker asks for 3.9).
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Standard library only: nothing to install. test_wire.py checks that
      # hp_wire.py still equals spec/spec.md Appendix B.
      - name: unittest (Python example)
        run: python -m unittest discover examples/python

      # The checker's self-tests: every reference fixture passes, and each
      # mutation of a valid chart, table or server fails with its section.
      - name: unittest (checker)
        run: python -m unittest discover spec/hpcheck

  # The checker against the Python and Node fixture renderers' output and
  # against the dashboard, Python and Node servers over HTTP. The example
  # tests above never read those files or hpcheck.json, so this is what
  # keeps the conformance commands in their READMEs working.
  conformance:
    name: Conformance (hpcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: make conformance
        run: make conformance PYTHON=python

  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # harness.mjs builds and runs the Go examples, and
      # examples.browser.mjs also starts the Python and Node servers.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The dev dependencies only: playwright-core (which downloads no
      # browser) and the htmx.org files the tests serve in place of the CDN,
      # so the tests need no network once installed.
      - name: npm ci
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund

      # ubuntu-latest ships Google Chrome and points CHROME_BIN at it
      # (actions/runner-images, install-google-chrome.sh). Fail clearly if
      # an image ever drops it, rather than inside the first test.
      - name: Find Chrome
        run: |
          chrome="${CHROME_BIN:-/usr/bin/google-chrome}"
          if [ ! -x "$chrome" ]; then
            echo "::error::No Chrome at $chrome on this runner image."
            exit 1
          fi
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      # Every browser test, including examples.browser.mjs, which opens
      # every example (Go, Python and Node) in turn.
      - name: npm run test:browser
        working-directory: client
        env:
          HP_BROWSER_TMP: ${{ runner.temp }}/hyperplot
          PYTHON: python
        run: npm run test:browser
