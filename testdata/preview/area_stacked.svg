<svg xmlns="http://www.w3.org/2000/svg" id="traffic" class="hp" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="traffic-title" aria-describedby="traffic-desc" tabindex="0" data-hp="1" data-hp-plot="55.22 85 570.46 282" data-hp-x="time 1772323200000 1773446400000" data-hp-y="linear 0 3000" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"><title id="traffic-title">Traffic by source</title><desc id="traffic-desc">Stacked area chart with 3 series: Search, Direct, Social. X axis time from Mar 1, 2026 to Mar 14, 2026. Y axis Visits, 0 to 3,000.</desc><style>.hp,.hp-spark,.hp-tip,.hp-table{--hp-surface:#ffffff;--hp-text:#191919;--hp-text-muted:#666666;--hp-grid:#e7e7e7;--hp-axis:#c2c2c2;--hp-series-1:#257de0;--hp-series-2:#f47230;--hp-series-3:#00b894;--hp-series-4:#f2a600;--hp-series-5:#ee7fac;--hp-series-6:#008a17;--hp-series-7:#6a4ce2;--hp-series-8:#ec4647;}
