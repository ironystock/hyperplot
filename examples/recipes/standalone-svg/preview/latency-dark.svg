<svg xmlns="http://www.w3.org/2000/svg" id="latency" class="hp" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="latency-title" aria-describedby="latency-desc" tabindex="0" data-hp="1" data-hp-plot="44.82 85 589.18 262" data-hp-x="time 1772546400000 1772550000000" data-hp-y="linear 0 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"><title id="latency-title">API latency, Mar 3, 2026</title><desc id="latency-desc">Line chart with 2 series: p50, p95. X axis time from Mar 3, 2026 2:00 PM to Mar 3, 2026 3:00 PM. Y axis ms, 0 to 300 ms. Reference line 250 ms objective at 250 ms.</desc><style>.hp,.hp-spark,.hp-tip,.hp-table{--hp-surface:#191919;--hp-text:#efefef;--hp-text-muted:#9c9c9c;--hp-grid:#303030;--hp-axis:#474747;--hp-series-1:#338ced;--hp-series-2:#e76624;--hp-series-3:#00a888;--hp-series-4:#d28e05;--hp-series-5:#e24d8b;--hp-series-6:#0aac23;--hp-series-7:#9887ef;--hp-series-8:#eb6263;}
